[package]
name = "mangowm-settings"
version = "0.1.1"
description = "mangowm settings app"
authors = ["you"]
edition = "2021"

[lib]
name = "mangowm_settings_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-fs = "2.6.0"
tauri-plugin-shell = "2.4.0"
tauri-plugin-dialog = "2.8.4"

