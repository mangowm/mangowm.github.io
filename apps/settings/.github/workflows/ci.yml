name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec tsc --noEmit

  build:
    name: Build (Linux)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: pnpm install --frozen-lockfile
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm tauri build
      - name: Get app version
        run: echo "APP_VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> $GITHUB_ENV
      - name: Fix AppImage Wayland compatibility
        shell: bash
        run: |
          APPIMAGE="src-tauri/target/release/bundle/appimage/mangowm-settings_${APP_VERSION}_amd64.AppImage"
          if [ ! -f "$APPIMAGE" ]; then
            echo "no AppImage found, skipping"
            exit 0
          fi
          ORIG_DIR="$PWD"
          cd /tmp
          mkdir -p appimage-fix
          cd appimage-fix
          "$ORIG_DIR/$APPIMAGE" --appimage-extract
          rm -f squashfs-root/usr/lib/libwayland-client.so*
          curl -sL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$ORIG_DIR/$APPIMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: mangowm-settings-appimage
          path: src-tauri/target/release/bundle/appimage/mangowm-settings_${{ env.APP_VERSION }}_amd64.AppImage
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: mangowm-settings-deb
          path: src-tauri/target/release/bundle/deb/mangowm-settings_${{ env.APP_VERSION }}_amd64.deb
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: mangowm-settings-rpm
          path: src-tauri/target/release/bundle/rpm/mangowm-settings-${{ env.APP_VERSION }}-1.x86_64.rpm
          if-no-files-found: warn
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/mangowm-settings_${{ env.APP_VERSION }}_amd64.AppImage
            src-tauri/target/release/bundle/deb/mangowm-settings_${{ env.APP_VERSION }}_amd64.deb
            src-tauri/target/release/bundle/rpm/mangowm-settings-${{ env.APP_VERSION }}-1.x86_64.rpm
          generate_release_notes: true
