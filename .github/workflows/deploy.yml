name: deploy to pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [showcase-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true
      - run: vp run ready
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          mkdir -p dist/docs dist/settings dist/schema
          cp -r apps/site/.output/public/. dist/
          cp -r apps/docs/dist/public/.   dist/docs/
          cp -r apps/settings/dist/.      dist/settings/
          cp -r packages/schema/schemas/. dist/schema/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v5
