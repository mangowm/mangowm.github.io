name: settings desktop

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: settings-desktop-${{ github.ref }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true

      - name: install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            librsvg2-dev

      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: apps/settings/src-tauri -> target

      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/settings
          tagName: settings-nightly
          releaseName: "mangowm settings nightly"
          releaseBody: "main@${{ github.sha }}"
          prerelease: true
          releaseCommitish: ${{ github.sha }}
          releaseAssetNamePattern: "mangowm-settings-[arch][ext]"
