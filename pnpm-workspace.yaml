packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@base-ui/react": ^1.9.0
  "@types/node": ^26.6.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  react: ^19.3.0
  react-dom: ^19.3.0
  "@vitejs/plugin-react": ^6.1.1
  "@rolldown/plugin-babel": ^0.2.4
  babel-plugin-react-compiler: ^1.0.0
  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  lucide-react: ^1.51.0
  cn: ^0.4.0
  "@tanstack/react-router": 1.170.41
  "@tanstack/react-start": 1.168.60
  "@tanstack/router-plugin": ^1.168.42
  "@tauri-apps/cli": ^2.12.1
  cmdk: ^1.1.1
  takumi-js: ^2.14.0
  yaml: ^2.9.1
overrides:
  vite@*: "catalog:"
publicHoistPattern:
  - "@takumi-rs/core-*"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - "@tanstack/*"
  - lucide-react@1.51.0
  - fumapress@1.6.1
